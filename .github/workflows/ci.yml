name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clipboard and cleanup regression tests
        shell: powershell
        run: |
          .\tests\core.ps1
      - name: Windows UI localization tests
        shell: powershell
        run: |
          .\tests\localization.ps1
      - name: Full Windows installation and upgrade
        shell: powershell
        run: |
          .\tests\install-e2e.ps1
      - name: PowerShell 5.1 syntax and assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('SnipToPath.ps1', 'install.ps1', 'uninstall.ps1', 'tests/core.ps1', 'tests/localization.ps1', 'tests/install-e2e.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "${file}: $_" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS PowerShell parsing: $file"
          }
          $source = Get-Content .\SnipToPath.ps1 -Raw -Encoding UTF8
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          foreach ($variable in @('xaml', 'quickXaml')) {
            $pattern = '(?s)\$' + $variable + '\s*=\s*@''\r?\n(.*?)\r?\n''@'
            $m = [regex]::Match($source, $pattern)
            if (-not $m.Success) { throw "XAML block missing: $variable" }
            [xml]$xaml = $m.Groups[1].Value
            if (-not $xaml.DocumentElement.LocalName.Equals('Window')) { throw "Invalid WPF root: $variable" }
            $window = [Windows.Markup.XamlReader]::Parse($m.Groups[1].Value)
            $window.Close()
            Write-Host "PASS WPF XAML parse: $variable"
          }
          # Compile the actual WPF/Win32 and native Explorer folder-picker types.
          $nativeMatch = [regex]::Match($source, '(?s)Add-Type -TypeDefinition @''\r?\n(.*?)\r?\n''@ -ReferencedAssemblies ''System.Drawing'', ''System.Windows.Forms''')
          if (-not $nativeMatch.Success) { throw 'Native UI C# declaration not found' }
          Add-Type -TypeDefinition $nativeMatch.Groups[1].Value -ReferencedAssemblies 'System.Drawing', 'System.Windows.Forms'
          if (-not ([SnipUI.Native].GetMethod('SetWindowPos'))) { throw 'Native HWND positioning is missing' }
          if (-not ([SnipUI.FolderPicker].GetMethod('Pick'))) { throw 'Modern folder picker is missing' }
          Write-Host 'PASS Win32 menu positioning and Explorer folder picker compile'
          $quickMatch = [regex]::Match($source, '(?s)\$quickXaml\s*=\s*@''\r?\n(.*?)\r?\n''@')
          if (-not $quickMatch.Success) { throw 'Quick menu XAML not found' }
          $quick = [Windows.Markup.XamlReader]::Parse($quickMatch.Groups[1].Value)
          foreach ($name in @('QuickEnabled','QuickSettings','QuickExit')) {
            if (-not $quick.FindName($name)) { throw "Missing tray action: $name" }
          }
          foreach ($removed in @('QuickAutoDelete','QuickStartup','QuickClear','QuickOpenFolder')) {
            if ($quick.FindName($removed)) { throw "Unexpected obsolete tray action: $removed" }
          }
          $quick.Close()
          Write-Host 'PASS compact tray menu actions'
          if ($source.Contains('new System.Windows.Forms.ContextMenuStrip')) { throw 'Legacy WinForms context menu must not return' }
          $icon = [IO.File]::ReadAllBytes((Resolve-Path .\assets\SnipToPath.ico))
          if ($icon.Length -lt 256 -or $icon[0] -ne 0 -or $icon[1] -ne 0 -or $icon[2] -ne 1 -or $icon[3] -ne 0) {
            throw 'Invalid ICO header'
          }
          Write-Host 'PASS icon header'
          $matchIcon = [regex]::Match($source, '(?s)\$ico\s*=\s*@''\r?\n(.*?)\r?\n''@')
          if (-not $matchIcon.Success) { throw 'Embedded ICO missing' }
          $embedded = [Convert]::FromBase64String(($matchIcon.Groups[1].Value -replace '\s', ''))
          if (-not [Linq.Enumerable]::SequenceEqual([byte[]]$icon, [byte[]]$embedded)) { throw 'Embedded icon differs from assets/SnipToPath.ico' }
          Write-Host 'PASS embedded icon matches asset'
          # Verify the refactored settings UI actually declares all its interactive controls.
          $mainMatch = [regex]::Match($source, '(?s)\$xaml\s*=\s*@''\r?\n(.*?)\r?\n''@')
          $settingsWindow = [Windows.Markup.XamlReader]::Parse($mainMatch.Groups[1].Value)
          foreach ($name in @('EnabledSwitch','AutoDeleteSwitch','QuotesSwitch','StartupSwitch','CleanupSwitch',
              'DeleteDelayInput','SaveDelayButton','ThemeSystem','ThemeLight','ThemeDark',
              'LanguageAuto','LanguageRu','LanguageEn',
              'OpenFolderButton','ClearButton','CloseButton','FolderButton','SaveFolderButton','FolderPathInput','StatusDot')) {
            if (-not $settingsWindow.FindName($name)) { throw "Missing UI control: $name" }
          }
          if ($settingsWindow.Height -gt 740 -or $settingsWindow.Width -gt 760) { throw 'Settings window must be compact' }
          $section = $settingsWindow.Resources['Section']
          if (-not ($section.Setters | Where-Object { $_.Property.Name -eq 'Foreground' })) {
            throw 'Section foreground must follow Windows theme'
          }
          $settingsWindow.Close()
          Write-Host 'PASS settings layout and controls'

          # Exercise delayed cleanup without a live clipboard or a UI session.
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          foreach ($fname in @('Queue-PreviousScreenshot', 'Invoke-PendingScreenshotCleanup')) {
            $functions = @($ast.FindAll({ param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $fname
            }, $true))
            if ($functions.Count -ne 1) { throw "Expected a single $fname function" }
            Invoke-Expression $functions[0].Extent.Text
          }
          $script:config = @{ AutoDeleteOnCopy = $true; DeleteDelaySeconds = 65 }
          $script:pendingScreenshotDeletes = New-Object 'System.Collections.Generic.List[object]'
          $testPath = Join-Path ([IO.Path]::GetTempPath()) ('sniptopath-ci-' + [Guid]::NewGuid().ToString('N') + '.png')
          [IO.File]::WriteAllBytes($testPath, [byte[]](1,2,3,4))
          try {
            $script:lastScreenshotPath = $testPath
            Queue-PreviousScreenshot
            if ($script:pendingScreenshotDeletes.Count -ne 1) { throw 'Missing scheduled cleanup' }
            $seconds = ($script:pendingScreenshotDeletes[0].DeleteAfter - [DateTime]::UtcNow).TotalSeconds
            if ($seconds -lt 63 -or $seconds -gt 67) { throw 'Incorrect cleanup delay in seconds' }
            $script:pendingScreenshotDeletes[0].DeleteAfter = [DateTime]::UtcNow.AddSeconds(-1)
            Invoke-PendingScreenshotCleanup
            if (Test-Path -LiteralPath $testPath) { throw 'Expired screenshot was not deleted' }
            Write-Host 'PASS delayed screenshot cleanup'
          } finally {
            Remove-Item -LiteralPath $testPath -Force -ErrorAction SilentlyContinue
          }
